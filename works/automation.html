## 概要
- バックオフィスの手続きが属人化していたため、ワークフローを自動化
- 申請・承認・通知までを一貫した仕組みに置き換え

## 役割
- 要件整理：現場ヒアリングで現行フローを棚卸し
- 設計：API化、スプレッドシートとの同期、Slack通知の構成を設計
- 実装：FastAPI + GCPでAPI、Apps Scriptでシート連携、Slack Appで通知
- 運用：権限・ログ管理、運用マニュアル作成

## 成果
- 日次工数を約50%削減、手戻りを大幅低減
- 実行履歴の可視化で監査対応が容易に
- 例外処理をコード化し、属人タスクを排除

## 技術スタック
- Backend: Python (FastAPI), Cloud Run, Firestore
- Integrations: Google Apps Script, Slack App (Bolt)
- Auth: JWT + IP制限、監査ログ
