## 概要
- 事業KPIを横断的に確認できるダッシュボードを新規構築
- 情報設計・デザインシステム整備・実装を担当

## 役割
- 要件整理／データ表示要件とUXの擦り合わせ
- UIデザイン（フィルタ、グラフ、カードレイアウト）
- フロントエンド実装（React + TypeScript + Chart.js）
- コンポーネントのStorybook化とアクセシビリティ確認

## 成果
- 主要指標の確認に必要なクリック数を約30%削減
- グラフ読み込み体感速度を約35%改善（スケルトン表示導入）
- 新規フィルタ追加にかかる工数を1/2に短縮（コンポーネント化）

## 技術スタック
- React, TypeScript, Chart.js, Storybook
- API: REST / JWT / キャッシュ層はSWRで制御
