## 概要
- 新規ユーザーの初回活性化率が低下していたため、オンボーディングを再設計
- メール、アプリ内モーダル、ツアーを統合したコミュニケーションに変更

## 役割
- リサーチ：ファネル分析・ユーザーインタビューで阻害要因を特定
- UX：導線設計、CTAメッセージ、ツアーステップのシナリオ策定
- 実装：フロント実装＋バックエンドのフラグ制御、メッセージ配信ロジック設計
- 計測：イベント設計とダッシュボード化

## 成果
- 初期定着率を向上（例: 7日後アクティブ率 +9pt）
- ヘルプデスクへの同種問い合わせを削減
- コンテンツ閲覧率・CTAクリック率が改善

## 技術スタック
- Front: React, TypeScript
- Back: Django (Feature Flag制御), Segment / GA4で計測
- Communication: In-appメッセージ + メール
