## 概要
- モバイル予約の離脱率が高い課題に対し、フロー全体を再設計
- ファネル分析から離脱ポイントを特定し、UI/UXを刷新

## 役割
- 分析：GA4とヒートマップで離脱箇所を特定
- UX設計：入力ステップ分割、エラーメッセージの即時表示
- 実装：Vue.js + Firebaseでフロント実装、フォームバリデーション共通化
- ABテスト：2パターンを運用し、改善案を定量評価

## 成果
- CVR +12%（ABテストで統計的有意を確認）
- 入力エラーの再入力率を減少、完了までの平均時間を短縮
- CS問い合わせを月次で約20%削減

## 技術スタック
- Vue.js, Firebase, GA4, Cloud Functions
- Design: コンポーネント化 + Storybookで共有
